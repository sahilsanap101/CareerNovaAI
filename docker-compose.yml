services:
  # ─── API (Backend) ───────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: pathforge_api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-jwt-secret-minimum-32-chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-this-in-production-refresh-secret-minimum-32-chars}
      JWT_EXPIRES_IN: 15m
      REFRESH_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:5173
      LOG_LEVEL: debug
    ports:
      - "5000:5000"
    volumes:
      # Hot reload in development
      - ./apps/api/src:/app/apps/api/src
      - ./packages:/app/packages
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Web (Frontend) ──────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: pathforge_web
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:5000/api/v1
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./packages:/app/packages
